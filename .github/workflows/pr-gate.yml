# Per-PR gate for open-control-library. It runs on GitHub Actions for pull requests into
# `development` and on manual dispatch, once per change: there is no `push` trigger, so a merge
# does not run it again on the tree the pull request already proved. release-gate.yml runs on the
# merge instead (and daily on the `development` tip, on release pull requests into `main` and on
# pushes to `main`).
#
# `CI OK` at the bottom is the single required status for branch protection on `development`. It
# needs every other job in this file and passes only when each one succeeded. No job is filtered,
# so a skipped job is a failure, and so is a cancelled one.
#
# What it runs: the workflow rules and their fixtures, the tracked-file scan, the lints and unit
# tests, the engine verification (G36 source inventory and declarations, the routine catalog, the
# reference replay of both routine subsequences, the fault verifier over every bundle, the dataset
# fixture replay) and the book build. That is the whole gate today, in about five minutes. A check
# that outgrows that budget moves to release-gate.yml by editing both files and .agents/gate.sh
# together.
#
# `bash .agents/gate.sh` is the local mirror of this file: the same commands in the same form.
# Change a command here first, then there. Nothing verifies mechanically that the two agree.
#
# Where the engine comes from: `ENGINE_PIN` is the only pin of the engine, one 40-hex commit.
# .github/scripts/pinned-sources.sh fetches that exact commit into a sibling directory, and the two
# Modelica Buildings commits named in routines/g36/, with plain git. tools/verify builds against the
# engine checkout as a path dependency, and its build script refuses a checkout whose HEAD differs
# from the pin or whose tracked files are modified. The Rust toolchain is the channel named in that
# checkout's rust-toolchain.toml, so the pin selects the compiler as well.
#
# Rules, enforced by .github/scripts/check_workflow_gates.py (job `workflow-rules`): every action
# is pinned to a full commit SHA with its tag in a trailing comment; every checkout drops the job
# token; every job has a timeout; no step may fail without failing its job; no job or step is
# conditional except `CI OK`; no run block interpolates the github.event context (values pass
# through env).

name: pr-gate

on:
  pull_request:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # A superseded pull-request run is cancelled; a dispatched run always finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  workflow-rules:
    name: Workflow rules and gate-script fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the workflow parser
        run: python3 -m pip install PyYAML==6.0.3

      - name: Check the workflow rules
        run: python3 .github/scripts/check_workflow_gates.py

      - name: Run the gate-script fixtures
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

  no-secret-scan:
    name: Tracked-file scan (home paths, UUID shapes, secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - run: bash .github/scripts/check-no-secrets.sh

  lint:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tools/lint/requirements-routine-schemas.txt

      - name: Install lint dependencies
        run: python3 -m pip install --requirement tools/lint/requirements-routine-schemas.txt PyYAML==6.0.3

      - name: svg fitment lint
        run: python3 tools/lint/svg_fitment.py

      - name: registry lint
        run: python3 tools/lint/registry.py

      - name: point semantic lint
        run: python3 tools/lint/point_semantics.py

      - name: routine catalog lint
        run: |
          python3 -m unittest discover -s tools/lint/tests -v
          python3 tools/lint/routine_schemas.py
          python3 tools/lint/routine_semantics.py
          python3 tools/lint/routines.py

      - name: Check authored reference graphs and reference tests
        run: |
          python3 tools/authoring/g36_reference.py --check
          python3 -m unittest discover -s tools/routines/tests -v
          python3 -m unittest discover -s tools/book/tests -v

      - name: Test external dataset harness
        run: python3 -m unittest discover -s tools/dataset_harness/tests -v

  verify:
    name: Engine verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: open-control-library
    steps:
      # The library is checked out one level down so that the pinned sources land beside it, where
      # tools/verify and the G36 checks look for them.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: open-control-library
          persist-credentials: false

      - name: Fetch pinned engine and Modelica Buildings sources
        run: bash .github/scripts/pinned-sources.sh fetch

      - name: Check the pinned sources and install the toolchain the pinned engine names
        run: |
          bash .github/scripts/pinned-sources.sh check
          channel="$(bash .github/scripts/pinned-sources.sh toolchain)"
          rustup toolchain install "$channel" --profile minimal --no-self-update
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: open-control-library/tools/lint/requirements-routine-schemas.txt

      - name: Install Python dependencies
        run: python3 -m pip install --requirement tools/lint/requirements-routine-schemas.txt PyYAML==6.0.3

      - name: Verify G36 source inventory
        run: |
          python3 tools/lint/g36_source.py --check \
            --release-root ../modelica-buildings-release \
            --development-root ../modelica-buildings-development

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            open-control-library/tools/routine-compiler
            open-control-library/tools/verify

      - name: Test G36 declaration package
        run: cargo test --locked --manifest-path tools/routine-compiler/Cargo.toml

      - name: Test G36 TrimAndRespond compiler integration
        env:
          OCL_G36_RELEASE_ROOT: ../../../modelica-buildings-release
          OCL_G36_DEVELOPMENT_ROOT: ../../../modelica-buildings-development
        run: cargo test --locked --manifest-path tools/routine-compiler/Cargo.toml --test g36_trim_and_respond -- --include-ignored

      - name: Verify G36 release declarations
        run: cargo run --locked --manifest-path tools/verify/Cargo.toml -- --g36-declarations ../modelica-buildings-release

      - name: Verify routine library
        run: cargo run --locked --manifest-path tools/verify/Cargo.toml -- --routines

      - name: Replay G36 reference subsequences (not deployment qualification)
        run: |
          python3 tools/routines/reference.py \
            --verifier tools/verify/target/debug/cxf-verify \
            --report target/g36-reference-results.json

      - name: Lint and verify fault library
        run: |
          cargo test --locked --manifest-path tools/verify/Cargo.toml
          cargo run --locked --manifest-path tools/verify/Cargo.toml -- --all

      - name: Replay original tiny FPU fixture through pinned engine
        run: |
          python3 tools/dataset_harness/harness.py replay \
            --adapter lbl-fpu \
            --dataset tools/dataset_harness/tests/fixtures/lbl_fpu_tiny \
            --rules FPB-0001,FPB-0002,FPB-0003,FPB-0004,FPB-0005,FPB-0006 \
            --verifier tools/verify/target/debug/cxf-verify \
            --output target/dataset-harness/ci-lbl-fpu-results.json
          python3 -c 'import json; p="target/dataset-harness/ci-lbl-fpu-results.json"; d=json.load(open(p)); assert d["schema"] == "cxf-library/dataset-validation/v1"; assert d["summary"]["fault_free_alarm_samples"] == 0; assert d["summary"]["target_declared_rule_case_pairs"] == 1; assert d["summary"]["target_detected_rule_case_pairs"] == 1'

  book:
    name: Book build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install checksum-pinned mdBook
        run: bash tools/book/install-mdbook.sh target/mdbook-bin

      - name: Install generator dependencies
        run: python3 -m pip install PyYAML==6.0.3

      - name: Generate book source from repository
        run: python3 tools/book/generate.py

      - name: Build book
        run: target/mdbook-bin/mdbook build book

  # The single required status for branch protection on `development`. It reports on every run and
  # fails unless every job above succeeded. check_workflow_gates.py asserts that `needs` lists
  # every other job in this file.
  ci-ok:
    name: CI OK
    if: always()
    needs: [workflow-rules, no-secret-scan, lint, verify, book]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Require success from every gating job
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci_ok.py
