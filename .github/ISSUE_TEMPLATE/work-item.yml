name: Work item
description: A milestone work item an agent can start cold. Label it agent-ready once every section is filled.
title: "<type(scope): what the change does, in the imperative>"
labels: []
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What is true when this is done, and the decision it rests on (name the tracking issue or design note; do not restate the reasoning).
    validations:
      required: true
  - type: textarea
    id: entry
    attributes:
      label: Entry points
      description: What exists today, checked in a fresh clone - files, counts, the commit they were taken at - and prior art to read.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Numbered list. Each item is something a reviewer can see in the diff.
      value: |
        1.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance checks
      description: Commands and their expected output, totals that must not move, runs to link, controls that must fail. A sentence saying it works is not acceptance.
    validations:
      required: true
  - type: textarea
    id: notouch
    attributes:
      label: Do not touch
      description: Bundles, vectors, registries, pins, tools - anything out of scope that a cold agent might reach for.
    validations:
      required: true
  - type: textarea
    id: deps
    attributes:
      label: Depends on
      description: Issue numbers, in this repository or the engine's. Add the `blocked` label if a dependency is open.
