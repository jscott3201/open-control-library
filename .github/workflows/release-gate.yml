# Release gate for open-control-library. It runs on GitHub Actions for every push to `development`
# (each merged pull request) and to `main` (each release), for release pull requests from
# `development` into `main`, daily against the `development` tip, and on manual dispatch.
#
# Disjoint from pr-gate.yml by base branch: a pull request into `development` matches pr-gate.yml
# only, and a release pull request into `main` matches this workflow only. `CI OK` at the bottom is
# the single required status for branch protection on `main`. On `development` it is not a required
# status, because the commit has already landed: a red run after a merge is fixed forward or
# reverted before the next change merges.
#
# What it runs: `bash .agents/gate.sh full`, the local gate script, executed from a fresh checkout
# with no restored cache. Today the per-PR gate is already the whole gate, so this run adds no new
# check. Its job is to repeat the gate on the merged tree and once a day, which is where a changed
# runner image, a changed Python or Rust distribution, or a dependency that can no longer be
# fetched shows up under an unchanged tree. It is also the only place CI executes the gate script
# itself. A check that later outgrows the per-PR budget moves here by editing pr-gate.yml, this
# file and .agents/gate.sh together.
#
# What each run checks out: `CHECKOUT_REF`, in both jobs. For every event but the schedule that is
# `github.sha`, the one commit GitHub resolved when the event fired: the pushed commit, the tip of
# the ref a run was dispatched on, the merge commit of a release pull request. A ref can move
# while a run waits for a runner and a commit cannot, so the gate job and `CI OK` read the same
# tree, and the result is recorded against the commit that was tested (for a release pull request,
# on its head commit, for the merge of that head into `main` as it was when the event fired). A
# scheduled run starts from the default branch's copy of this file and checks out `development` by
# name, so that it follows that branch whatever the default branch is. It is the one run that can
# test a newer commit than the one its result is recorded on, when a merge lands before its job
# starts; that merge has a push run of its own.
#
# Concurrency: one group per event and ref, and only a superseded release pull-request run is
# cancelled. For pushes that means a run in progress always finishes, one run waits behind it, and
# a newer push replaces the waiting run (GitHub keeps one pending run per group). The newest
# waiting run tests a commit that contains every merge before it. A replaced waiting run shows as
# cancelled on its merge commit; the run that replaced it is the evidence.
#
# The rules in pr-gate.yml's header apply here and are enforced by the same check. It also holds
# this file to exactly the triggers above, to `CHECKOUT_REF` as written below and its use by every
# checkout, and to the pinned command lines (the gate-script step among them, with nothing after
# it), and it refuses any cache action.

name: release-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, development]
  schedule:
    # Daily run on the `development` tip. Schedules start from the default branch.
    - cron: "41 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # Only a superseded release pull-request run is cancelled. A push, scheduled or dispatched run in
  # progress always finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  CARGO_TERM_COLOR: always
  CHECKOUT_REF: ${{ github.event_name == 'schedule' && 'development' || github.sha }}

defaults:
  run:
    shell: bash

jobs:
  gate:
    name: gate (full)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: open-control-library
    steps:
      # One level down, so that the pinned sources land beside the library (see pr-gate.yml).
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.CHECKOUT_REF }}
          path: open-control-library
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Fetch pinned engine and Modelica Buildings sources
        run: bash .github/scripts/pinned-sources.sh fetch

      # The gate script installs no toolchain. It selects this one itself, from the same file.
      - name: Install the toolchain the pinned engine names
        run: |
          channel="$(bash .github/scripts/pinned-sources.sh toolchain)"
          rustup toolchain install "$channel" --profile minimal --no-self-update

      - name: Run the full gate script
        run: bash .agents/gate.sh full

  # The single required status for branch protection on `main`. It reports on every run and fails
  # unless the gate job succeeded. check_workflow_gates.py asserts that `needs` lists every other
  # job in this file.
  ci-ok:
    name: CI OK
    if: always()
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.CHECKOUT_REF }}
          persist-credentials: false

      - name: Require success from every gating job
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci_ok.py
