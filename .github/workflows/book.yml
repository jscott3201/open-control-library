# Publish the mdBook to GitHub Pages. Manual dispatch only: continuous build
# validation runs in the primary CI (.forgejo/workflows/ci.yml). This workflow
# stays dormant while GitHub Actions is disabled on the public mirror.
name: book

on:
  workflow_dispatch:

env:
  MDBOOK_VERSION: v0.5.4

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: book-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook (pinned)
        run: |
          mkdir -p "$HOME/bin"
          curl -sSfL "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz --directory="$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Install generator dependencies
        run: python3 -m pip install PyYAML==6.0.3
      - name: Generate book source from repository
        run: python3 tools/book/generate.py
      - name: Build book
        run: mdbook build book
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: book/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
