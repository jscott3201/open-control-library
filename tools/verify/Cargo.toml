[package]
name = "cxf-verify"
version = "0.1.0"
edition = "2024"
publish = false
description = "Loads OCL CXF graphs into the open-control engine and replays their vector scenarios"

[dependencies]
ocl-routine-compiler = { path = "../routine-compiler" }
oce-api = { path = "../../../open-control/crates/oce-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
