# Build the book on pull requests that touch its inputs, and publish it from `main`.
#
# A pull request into `development` that changes anything the book is generated from runs the
# build job: the generator tests, the generator and mdBook, with nothing published. A push to
# `main` (a release) and a manual dispatch on `main` also upload the built site and deploy it to
# GitHub Pages, so the published book is the released tree. A dispatch on any other branch builds
# and publishes nothing.
#
# This workflow is path-filtered, so it cannot be a required status. The per-PR gate
# (pr-gate.yml, job `book`) builds the book on every pull request under `CI OK`, and
# `bash .agents/gate.sh` does the same locally. Change the build commands here and there together.
#
# mdBook is installed by tools/book/install-mdbook.sh, which verifies the release archive and the
# extracted binary against the SHA-256 digests pinned in tools/book/mdbook-checksums.txt.
#
# The pinning, checkout-token, timeout, runner, shell and concurrency rules of pr-gate.yml apply
# here and are enforced by .github/scripts/check_workflow_gates.py. Only the deploy job widens the
# token, to exactly the two permissions below, and the check holds it to the condition below.

name: book-pages

on:
  pull_request:
    branches: [development]
    paths:
      - ".github/workflows/book-pages.yml"
      - "book/**"
      - "tools/book/**"
      - "tools/point_resolution.py"
      - "faults/**"
      - "routines/**"
      - "points/**"
      - "playbooks/**"
      - "clusters/**"
      - "assets/**"
      - "README.md"
      - "Handoff.md"
      - "SCHEMA.md"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book-pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build the book
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install checksum-pinned mdBook
        run: bash tools/book/install-mdbook.sh target/mdbook-bin

      - name: Install generator dependencies
        run: python3 -m pip install PyYAML==6.0.3

      - name: Test the book generator
        run: python3 -m unittest discover -s tools/book/tests -v

      - name: Generate book source from repository
        run: python3 tools/book/generate.py

      - name: Build book
        run: target/mdbook-bin/mdbook build book

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: book/book

  deploy:
    name: Deploy the released book
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
