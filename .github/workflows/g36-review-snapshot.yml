name: G36 review workspace
on:
  push:
    branches: [review/g36-pass1-2026-09-08]
    paths: [.github/workflows/g36-review-snapshot.yml]
permissions:
  contents: read
jobs:
  verifier:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: library
          persist-credentials: false
      - name: Read existing engine selection
        id: engine
        run: echo "rev=$(cat library/ENGINE_PIN)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: jscott3201/open-control-engine
          ref: ${{ steps.engine.outputs.rev }}
          path: open-control
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build verifier
        run: cargo build --locked --manifest-path library/tools/verify/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: g36-review-verifier
          path: library/tools/verify/target/debug/cxf-verify
          retention-days: 1
