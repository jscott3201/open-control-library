name: G36 review workspace
on:
  push:
    branches: [review/g36-pass1-2026-09-08]
    paths: [.github/review-payload/04.b64]
permissions:
  contents: write
jobs:
  integrate:
    if: github.ref == 'refs/heads/review/g36-pass1-2026-09-08'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/g36-pass1-2026-09-08
      - name: Apply reviewed source changes
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import lzma
          import pathlib
          parts = pathlib.Path('.github/review-payload')
          encoded = ''.join((parts / f'{i:02}.b64').read_text().strip() for i in range(1, 5))
          pathlib.Path('/tmp/g36-pass1.patch').write_bytes(lzma.decompress(base64.b64decode(encoded, validate=True)))
          PY
          git apply --index --exclude=.github/workflows/verify.yml /tmp/g36-pass1.patch
          git rm .github/review-payload/*.b64
          python3 -m compileall -q tools/routines tools/authoring/g36_reference.py tools/book tools/lint
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(routines): integrate engine-tested G36-2018 reference subsequences and cards'
          git push origin HEAD:review/g36-pass1-2026-09-08
